# The gate suite, run by GitHub on every push and pull request.
#
# Git hooks are per-clone: a clone that never ran the install command commits with no gate at all,
# and nothing in the repository can detect that. This workflow is the backstop — the same suite,
# the same scripts, run where the clone's hook state does not matter (decision 2026-09-22-001).
#
# Two stages, because `pre-commit run --all-files` covers the pre-commit stage only: the commit-msg
# gate is run over every commit the push or pull request carries.
name: gates

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # template_version.py verifies every tag against the commit it points at

      # On a tag push, actions/checkout re-fetches the ref as `+<sha>:refs/tags/<tag>`, which
      # replaces the annotated tag with a lightweight one. The version gate then reads the commit
      # subject where the annotation should be and fails. Fetching the real tag objects back keeps
      # the gate honest on the one event that exists to verify a tag ([[reference_ci_annotated_tags]]).
      - run: git fetch --force --tags origin

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - run: pip install pre-commit

      - name: Pre-commit-stage gates
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Commit-msg-stage gate over every commit in this push or pull request
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -eu
          if [ "$EVENT" = "pull_request" ]; then
            range="origin/$BASE_REF..HEAD"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            range="$BEFORE..HEAD"      # a normal push: exactly the commits it carried
          else
            range="HEAD~1..HEAD"        # a new branch or a force-push: the tip only
          fi
          echo "checking commit messages in $range"
          for sha in $(git rev-list "$range"); do
            git log -1 --format=%B "$sha" > /tmp/msg
            echo "--- $(git log -1 --format='%h %s' "$sha")"
            pre-commit run --hook-stage commit-msg --commit-msg-filename /tmp/msg --all-files
          done
